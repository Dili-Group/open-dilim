# ci.yml — chạy trên mọi PR và mọi push vào main. Không push image, không deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # --frozen-lockfile: CI fail nếu bun.lock lệch package.json, không tự sửa lockfile.
      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      # `bun run test`, KHÔNG `bun test` trần: script pin --env-file=.env.test (rỗng) nên máy dev
      # chạy đúng env như runner. `bun test` trần ở local tự nạp `.env` → xanh ở local, đỏ ở đây.
      - run: bun run test

      # Build thật để bắt lỗi Dockerfile ngay ở PR (không push — PR từ fork không có quyền ghi).
      - run: docker build -t dilim-agent:ci .
